<!-- Botón flotante -->
<div class="chat-fab" (click)="toggleChat()" [class.open]="abierto">
  <span class="fab-icon" *ngIf="!abierto">💬</span>
  <span class="fab-icon" *ngIf="abierto">✕</span>
</div>

<!-- Ventana del chat -->
<div class="chat-window" [class.visible]="abierto">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-avatar">⚡</div>
    <div class="chat-header-info">
      <span class="chat-name">Asistente NeoMarket</span>
      <span class="chat-status">
        <span class="status-dot"></span>
        En línea
      </span>
    </div>
    <button class="chat-close" (click)="toggleChat()">✕</button>
  </div>

  <!-- Mensajes -->
  <div class="chat-messages" #messagesContainer>
    <div
      *ngFor="let msg of mensajes"
      class="mensaje"
      [class.usuario]="msg.role === 'user'"
      [class.asistente]="msg.role === 'assistant'"
    >
      <div class="burbuja">
        <p>{{ msg.content }}</p>
        <span class="hora">{{ msg.timestamp | date:'HH:mm' }}</span>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="mensaje asistente" *ngIf="cargando">
      <div class="burbuja typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea
      [(ngModel)]="inputTexto"
      (keydown)="onKeyDown($event)"
      placeholder="Escribe tu mensaje..."
      rows="1"
      [disabled]="cargando"
    ></textarea>
    <button class="send-btn" (click)="enviar()" [disabled]="!inputTexto.trim() || cargando">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>
