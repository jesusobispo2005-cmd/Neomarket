<div class="filter">

  <input
    class="buscador"
    type="text"
    placeholder="Buscar producto..."
    [(ngModel)]="searchText"
    (input)="onSearchChange()"
  />

  <select
    [(ngModel)]="category"
    (change)="onCategoryChange()"
  >
    <option value="">Todas</option>
    <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
  </select>

</div>
