<div *ngIf="product" class="card">

  <div class="img-wrapper">
    <img
      *ngIf="product.Imagenes?.length"
      [src]="'http://localhost:3000/uploads/img/' + product.Imagenes[0]"
      [alt]="product.Nombre"
    />
    <div *ngIf="!product.Imagenes?.length" class="no-img">Sin imagen</div>

    <button
      class="wish-btn"
      [class.active]="enWishlist"
      (click)="toggleWishlist($event)"
      [title]="enWishlist ? 'Quitar de wishlist' : 'Añadir a wishlist'"
    >
      {{ enWishlist ? '❤️' : '🤍' }}
    </button>
  </div>

  <div class="info">
    <h2>{{ product.Nombre }}</h2>
    <p>{{ product.Descripcion }}</p>
    <h3>{{ product.Precio }} €</h3>
    <button class="btn-ver" (click)="verProducto()">Ver producto →</button>
  </div>

</div>
