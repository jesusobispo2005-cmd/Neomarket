<div class="app-wrapper">

  <nav class="navbar">

    <div routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">NeoMarket</span>
    </div>

    <button class="hamburger" (click)="toggleMenu()">
      {{ menuAbierto ? '✕' : '☰' }}
    </button>

    <div class="nav-links" [class.open]="menuAbierto">
      <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="menuAbierto = false">Home</a>

      <a *ngIf="!isLoggedIn" routerLink="login" routerLinkActive="active" (click)="menuAbierto = false">Login</a>

      <a *ngIf="isAdmin" routerLink="admin" routerLinkActive="active" class="admin-link" (click)="menuAbierto = false">⚙️ Admin</a>

      <a routerLink="wishlist" routerLinkActive="active" title="Wishlist" (click)="menuAbierto = false">
        ❤️ Wishlist
        <span class="nav-badge" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
      </a>

      <a routerLink="carrito" routerLinkActive="active" title="Carrito" (click)="menuAbierto = false">
        🛒 Carrito
        <span class="nav-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <div *ngIf="isLoggedIn" routerLink="perfil" class="avatar" title="Mi perfil" (click)="menuAbierto = false">U</div>

      <button *ngIf="isLoggedIn" class="logout-btn" (click)="logout()" title="Cerrar sesión">Cerrar Sesion</button>
    </div>

  </nav>

  <router-outlet></router-outlet>

</div>

<!-- Chatbox flotante — visible en toda la app -->
<app-chatbox></app-chatbox>
