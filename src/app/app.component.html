<div class="app-wrapper">

  <nav class="navbar">

    <div routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">NeoMarket</span>
    </div>

    <div class="nav-links">
      <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>

      <a *ngIf="!isLoggedIn" routerLink="login" routerLinkActive="active">Login</a>

      <a *ngIf="isAdmin" routerLink="admin" routerLinkActive="active" class="admin-link">⚙️ Admin</a>

      <a routerLink="wishlist" class="icon-btn" routerLinkActive="active" title="Wishlist">
        <span>❤️</span>
        <span class="nav-badge" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
      </a>

      <a routerLink="carrito" class="icon-btn" routerLinkActive="active" title="Carrito">
        <span>🛒</span>
        <span class="nav-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <div *ngIf="isLoggedIn" routerLink="perfil" class="avatar" title="Mi perfil">U</div>

      <button *ngIf="isLoggedIn" class="logout-btn" (click)="logout()" title="Cerrar sesión">Cerrar Sesion</button>
    </div>

  </nav>

  <router-outlet></router-outlet>

</div>

<!-- Chatbox flotante — visible en toda la app -->
<app-chatbox></app-chatbox>
