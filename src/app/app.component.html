<div class="app-wrapper">

  <nav class="navbar">

    <div class="nav-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">NeoMarket</span>
    </div>

    <div class="nav-links">
      <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="login" routerLinkActive="active">Login</a>
      <a routerLink="register" routerLinkActive="active">Register</a>

      <!-- Wishlist -->
      <a routerLink="wishlist" class="icon-btn" routerLinkActive="active" title="Wishlist">
        <span>❤️</span>
        <span class="nav-badge" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
      </a>

      <!-- Carrito -->
      <a routerLink="carrito" class="icon-btn" routerLinkActive="active" title="Carrito">
        <span class="cart-icon">🛒</span>
        <span class="nav-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <div class="avatar">U</div>
    </div>

  </nav>

  <router-outlet></router-outlet>

</div>
